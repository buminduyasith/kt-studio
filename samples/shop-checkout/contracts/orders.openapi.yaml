openapi: 3.0.3
info:
  title: Orders API
  version: 1.8.0
  description: Served by order-service. Payment is asynchronous; poll GET /orders/{id} after creating.
servers:
  - url: https://api.shop.example/orders-service

paths:
  /orders:
    post:
      operationId: createOrder
      summary: Place an order and reserve its stock for 15 minutes
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } }
      responses:
        '201':
          description: Created in PENDING_PAYMENT. Location header points to /orders/{id}.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Order' } }
        '400': { description: Validation failed }
        '409': { description: At least one SKU is out of stock; nothing was reserved (problem+json) }
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The order
          content:
            application/json: { schema: { $ref: '#/components/schemas/Order' } }
        '404': { description: Unknown order }

components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [customerId, currency, items]
      properties:
        customerId: { type: string }
        currency: { type: string, enum: [EUR, USD, GBP] }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string, example: SKU-MUG-01 }
              quantity: { type: integer, minimum: 1, maximum: 10 }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_PAYMENT, PAID, SHIPPED, CANCELLED] }
        totalCents: { type: integer, example: 7499 }
        currency: { type: string }
        paymentId: { type: string, nullable: true, description: PSP payment intent id once PAID }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              quantity: { type: integer }
              unitPriceCents: { type: integer, description: Price snapshot taken at reservation }
