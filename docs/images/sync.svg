<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-labelledby="title desc">
  <title id="title">How each action lands on its word</title>
  <desc id="desc">The voice line is made first. Word start times are worked out from it. The recording script names a cue word for each action, the cursor starts early by the time it really needs, and the click lands about 0.12 seconds after the word starts. A check fails any action more than 0.4 seconds late.</desc>
  <defs>
    <style>
      :root {
        --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #d1d9e0; --panel: #f6f8fa;
        --voice: #0969da; --cue: #bc4c00; --cur: #8250df; --cur-f: #fbefff; --ok: #1a7f37; --ok-f: #dafbe1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --line: #3d444d; --panel: #151b23;
          --voice: #4493f8; --cue: #f0883e; --cur: #ab7df8; --cur-f: #231a33; --ok: #3fb950; --ok-f: #0f2a19;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h1 { font-size: 28px; font-weight: 700; }
      .sub { font-size: 15px; fill: var(--muted); }
      .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .st { font-size: 15px; font-weight: 700; }
      .sb { font-size: 13px; fill: var(--muted); }
      .lane { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: var(--muted); }
      .w { font-size: 14px; font-weight: 600; }
      .cue { fill: var(--cue); font-weight: 800; }
      .tl { font-size: 11.5px; fill: var(--muted); }
      .cl { font-size: 12.5px; font-weight: 600; fill: var(--cur); }
      .bg { fill: var(--bg); }
      .lblbg { fill: var(--panel); }
      .cuet { fill: var(--cue); font-weight: 700; }
      .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
      .wave { fill: var(--voice); opacity: .85; }
      .tick { stroke: var(--muted); stroke-width: 1.2; }
      .axis { stroke: var(--muted); stroke-width: 1.2; }
      .guide { stroke: var(--cue); stroke-width: 1.5; stroke-dasharray: 5 4; }
      .cur { fill: var(--cur-f); stroke: var(--cur); stroke-width: 1.5; }
      .click { fill: var(--cur); }
      .ring { fill: none; stroke: var(--cur); stroke-width: 1.5; opacity: .5; }
      .okc { fill: var(--ok-f); stroke: var(--ok); stroke-width: 1.5; }
      .okt { font-size: 12.5px; font-weight: 700; fill: var(--ok); }
      .badge-v { fill: var(--voice); } .badge-c { fill: var(--cue); } .badge-p { fill: var(--cur); } .badge-k { fill: var(--ok); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="620" rx="16"/>
  <text class="h1" x="37" y="54">How each action lands on its word</text>
  <text class="sub" x="37" y="82">The voice is made before the recording, so the script knows when every word is spoken.</text>

  <!-- steps -->
  <circle class="badge-v" cx="52" cy="140" r="13"/><text class="n" x="52" y="145" text-anchor="middle">1</text>
  <text class="st" x="76" y="145">Voice first</text>
  <text class="sb" x="76" y="166">Kokoro speaks each line offline</text>
  <text class="sb" x="76" y="184">before anything is recorded.</text>

  <circle class="badge-c" cx="52" cy="226" r="13"/><text class="n" x="52" y="231" text-anchor="middle">2</text>
  <text class="st" x="76" y="231">Word times</text>
  <text class="sb" x="76" y="252">When each word starts, from the</text>
  <text class="sb" x="76" y="270">pauses in the voice (or Whisper).</text>

  <circle class="badge-c" cx="52" cy="312" r="13"/><text class="n" x="52" y="317" text-anchor="middle">3</text>
  <text class="st" x="76" y="317">A cue word per action</text>
  <text class="sb mono" x="76" y="339" font-size="12">s.choose(slot, '10:30', 'time')</text>
  <text class="sb mono" x="76" y="357" font-size="12">s.click(book, 'Book')</text>

  <circle class="badge-p" cx="52" cy="398" r="13"/><text class="n" x="52" y="403" text-anchor="middle">4</text>
  <text class="st" x="76" y="403">The cursor starts early</text>
  <text class="sb" x="76" y="424">It measures how fast it really</text>
  <text class="sb" x="76" y="442">moves, so the click lands on time.</text>

  <circle class="badge-k" cx="52" cy="484" r="13"/><text class="n" x="52" y="489" text-anchor="middle">5</text>
  <text class="st" x="76" y="489">Checked after recording</text>
  <text class="sb" x="76" y="510">check_sync fails any action more</text>
  <text class="sb" x="76" y="528">than 0.4 s after its word.</text>

  <!-- timeline panel -->
  <rect class="panel" x="400" y="112" width="803" height="476" rx="14"/>
  <text class="lane" x="418" y="210">VOICE</text>
  <text class="lane" x="418" y="282">WORD</text>
  <text class="lane" x="418" y="298">TIMES</text>
  <text class="lane" x="418" y="380">CURSOR</text>
  <text class="lane" x="418" y="470">CHECK</text>

  <text class="tl" x="520.0" y="134">scene starts: sync.say() marks it at 0 s</text>
  <line class="tick" x1="520.0" y1="140" x2="520.0" y2="508"/>

  <line class="guide" x1="675.8" y1="174" x2="675.8" y2="490"/>
  <line class="guide" x1="971.0" y1="174" x2="971.0" y2="490"/>
  <text class="w" x="589.7" y="165">Pick</text>
  <text class="w" x="655.3" y="165">a</text>
  <text class="w cue" x="675.8" y="165">time,</text>
  <text class="w" x="817.2" y="165">then</text>
  <text class="w" x="872.6" y="165">click</text>
  <text class="w cue" x="971.0" y="165">Book.</text>
