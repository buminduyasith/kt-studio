height="26.0" rx="1.6"/><rect class="wave" x="725.0" y="188.2" width="3.2" height="33.6" rx="1.6"/><rect class="wave" x="729.9" y="194.0" width="3.2" height="21.9" rx="1.6"/><rect class="wave" x="734.8" y="192.0" width="3.2" height="26.1" rx="1.6"/><rect class="wave" x="739.8" y="193.0" width="3.2" height="24.0" rx="1.6"/><rect class="wave" x="744.7" y="196.3" width="3.2" height="17.5" rx="1.6"/><rect class="wave" x="749.6" y="197.4" width="3.2" height="15.2" rx="1.6"/><rect class="wave" x="754.5" y="201.6" width="3.2" height="6.7" rx="1.6"/><rect class="wave" x="817.2" y="202.7" width="3.2" height="4.6" rx="1.6"/><rect class="wave" x="822.2" y="198.3" width="3.2" height="13.4" rx="1.6"/><rect class="wave" x="827.1" y="192.9" width="3.2" height="24.1" rx="1.6"/><rect class="wave" x="832.0" y="192.6" width="3.2" height="24.8" rx="1.6"/><rect class="wave" x="836.9" y="192.3" width="3.2" height="25.3" rx="1.6"/><rect class="wave" x="841.9" y="189.6" width="3.2" height="30.9" rx="1.6"/><rect class="wave" x="846.8" y="190.9" width="3.2" height="28.2" rx="1.6"/><rect class="wave" x="851.7" y="193.0" width="3.2" height="23.9" rx="1.6"/><rect class="wave" x="856.6" y="191.1" width="3.2" height="27.7" rx="1.6"/><rect class="wave" x="861.5" y="194.5" width="3.2" height="20.9" rx="1.6"/><rect class="wave" x="866.5" y="200.0" width="3.2" height="9.9" rx="1.6"/><rect class="wave" x="872.6" y="201.8" width="3.2" height="6.5" rx="1.6"/><rect class="wave" x="877.5" y="197.7" width="3.2" height="14.6" rx="1.6"/><rect class="wave" x="882.4" y="193.2" width="3.2" height="23.5" rx="1.6"/><rect class="wave" x="887.4" y="191.9" width="3.2" height="26.2" rx="1.6"/><rect class="wave" x="892.3" y="193.6" width="3.2" height="22.8" rx="1.6"/><rect class="wave" x="897.2" y="187.1" width="3.2" height="35.8" rx="1.6"/><rect class="wave" x="902.1" y="193.7" width="3.2" height="22.7" rx="1.6"/><rect class="wave" x="907.0" y="191.0" width="3.2" height="28.0" rx="1.6"/><rect class="wave" x="912.0" y="188.4" width="3.2" height="33.2" rx="1.6"/><rect class="wave" x="916.9" y="194.0" width="3.2" height="22.0" rx="1.6"/><rect class="wave" x="921.8" y="192.4" width="3.2" height="25.1" rx="1.6"/><rect class="wave" x="926.7" y="196.9" width="3.2" height="16.3" rx="1.6"/><rect class="wave" x="931.6" y="195.0" width="3.2" height="20.0" rx="1.6"/><rect class="wave" x="936.6" y="197.5" width="3.2" height="14.9" rx="1.6"/><rect class="wave" x="971.0" y="201.8" width="3.2" height="6.5" rx="1.6"/><rect class="wave" x="975.9" y="197.0" width="3.2" height="16.0" rx="1.6"/><rect class="wave" x="980.8" y="197.2" width="3.2" height="15.5" rx="1.6"/><rect class="wave" x="985.8" y="193.4" width="3.2" height="23.1" rx="1.6"/><rect class="wave" x="990.7" y="192.6" width="3.2" height="24.8" rx="1.6"/><rect class="wave" x="995.6" y="191.5" width="3.2" height="27.0" rx="1.6"/><rect class="wave" x="1000.5" y="191.6" width="3.2" height="26.8" rx="1.6"/><rect class="wave" x="1005.4" y="187.8" width="3.2" height="34.3" rx="1.6"/><rect class="wave" x="1010.4" y="186.6" width="3.2" height="36.9" rx="1.6"/><rect class="wave" x="1015.3" y="190.5" width="3.2" height="29.0" rx="1.6"/><rect class="wave" x="1020.2" y="189.1" width="3.2" height="31.8" rx="1.6"/><rect class="wave" x="1025.1" y="194.5" width="3.2" height="20.9" rx="1.6"/><rect class="wave" x="1030.0" y="190.1" width="3.2" height="29.8" rx="1.6"/><rect class="wave" x="1035.0" y="191.6" width="3.2" height="26.8" rx="1.6"/><rect class="wave" x="1039.9" y="190.7" width="3.2" height="28.6" rx="1.6"/><rect class="wave" x="1044.8" y="193.6" width="3.2" height="22.7" rx="1.6"/><rect class="wave" x="1049.7" y="198.3" width="3.2" height="13.5" rx="1.6"/><rect class="wave" x="1054.6" y="200.1" width="3.2" height="9.8" rx="1.6"/>
